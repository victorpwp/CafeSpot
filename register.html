<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare - CafeSpot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <nav class="topbar shadow-sm border-b px-6 py-4 sticky top-0 z-50 text-center">
        <a href="index.html" class="brand text-2xl hover:opacity-85 justify-center">
            <span class="brand-word">CafeSpot</span>
        </a>
    </nav>

    <div class="flex justify-center items-center py-20 px-4">
        <div class="soft-card p-8 rounded-2xl border w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6">Creare Cont Nou</h2>
            <input type="text" placeholder="Nume utilizator" class="w-full mb-4 p-3 border border-orange-100 rounded-lg focus:ring-2 focus:ring-teal-300 focus:outline-none">
            <input type="email" placeholder="Email" class="w-full mb-4 p-3 border border-orange-100 rounded-lg focus:ring-2 focus:ring-teal-300 focus:outline-none">
            <input type="password" placeholder="Parolă" class="w-full mb-6 p-3 border border-orange-100 rounded-lg focus:ring-2 focus:ring-teal-300 focus:outline-none">
            <button class="w-full cta-button py-3 rounded-lg font-bold mb-4">Creează Cont</button>
            <p class="text-center text-sm">Ai deja cont? <a href="login.html" class="link-accent font-bold hover:underline">Autentifică-te</a></p>
        </div>
    </div>
</body>
</html>
