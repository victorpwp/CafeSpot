<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panou Administrator - CafeSpot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <nav class="topbar shadow-sm border-b px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="brand text-2xl hover:opacity-85">
                <span class="brand-word">CafeSpot</span>
            </a>
            <span class="accent-pill text-xs font-bold px-3 py-1 rounded-full uppercase">Mod Administrator</span>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-stone-800">Panou Administrator</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="soft-card p-6 rounded-xl border">
                <h2 class="text-xl font-bold mb-4">Adaugă Cafenea Nouă</h2>
                <input type="text" id="cafe-nume" placeholder="Nume Cafenea" class="w-full mb-3 p-2 border border-orange-100 rounded focus:ring-2 focus:ring-teal-300 focus:outline-none">
                <input type="text" id="cafe-adresa" placeholder="Adresă" class="w-full mb-3 p-2 border border-orange-100 rounded focus:ring-2 focus:ring-teal-300 focus:outline-none">
                <div class="flex space-x-3 mb-3">
                    <input type="number" id="cafe-lat" placeholder="Latitudine" class="w-1/2 p-2 border border-orange-100 rounded focus:ring-2 focus:ring-teal-300 focus:outline-none">
                    <input type="number" id="cafe-long" placeholder="Longitudine" class="w-1/2 p-2 border border-orange-100 rounded focus:ring-2 focus:ring-teal-300 focus:outline-none">
                </div>
                <textarea id="cafe-descriere" placeholder="Descriere" class="w-full mb-3 p-2 border border-orange-100 rounded h-24 focus:ring-2 focus:ring-teal-300 focus:outline-none"></textarea>
                <input type="text" id="cafe-orar" placeholder="Program (ex: 08:00 - 20:00)" class="w-full mb-4 p-2 border border-orange-100 rounded focus:ring-2 focus:ring-teal-300 focus:outline-none">
                <button id="btn-salveaza" class="cta-button px-4 py-2 rounded font-bold">Salvează</button>
            </div>

            <div>
                <div class="soft-card p-6 rounded-xl border mb-6">
                    <h2 class="text-xl font-bold mb-4">Gestionează Cafenele</h2>
                    <ul class="divide-y">
                        <li class="py-3 flex justify-between items-center">
                            <span>Cafeneaua Central</span>
                            <div>
                                <button class="text-blue-600 text-sm mr-3 hover:underline">Editează</button>
                                <button class="text-red-600 text-sm hover:underline">Șterge</button>
                            </div>
                        </li>
                    </ul>
                </div>

                <div class="soft-card p-6 rounded-xl border">
                    <h2 class="text-xl font-bold mb-4">Moderare Recenzii</h2>
                    <div class="border border-orange-100 p-3 rounded mb-3 bg-orange-50/60">
                        <p class="text-sm font-bold">Mihai D. -> Cafeneaua Central</p>
                        <p class="text-sm text-gray-600 italic">"Cafeaua a fost rece."</p>
                        <div class="mt-2 space-x-2">
                            <button class="text-green-600 text-xs font-bold border border-green-600 px-2 py-1 rounded">Aprobă</button>
                            <button class="text-red-600 text-xs font-bold border border-red-600 px-2 py-1 rounded">Șterge</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

   <script src="admin.js"></script>

</body>
</html>
