<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeSpot - Acasă</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS (Design-ul hărții) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet JS (Logica hărții) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-extrabold text-amber-900 tracking-tighter hover:opacity-80">CafeSpot</a>
            <div class="hidden md:block flex-1 max-w-lg mx-8 relative">
                <input type="text" placeholder="Caută cafenele după nume sau locație..." class="w-full bg-gray-100 rounded-full py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-amber-800">
                <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
            </div>
            <div class="flex space-x-2 md:space-x-4 items-center">
                <a href="admin.html" class="text-sm font-medium text-gray-500 hover:text-amber-900">Admin</a>
                <a href="login.html" class="text-sm font-medium text-gray-600 hover:text-amber-900">Autentificare</a>
                <a href="register.html" class="bg-amber-900 text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-amber-800 transition">Înregistrare</a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-3">Găsește locul perfect.</h1>
            <p class="text-gray-500 max-w-xl mx-auto">Explorează cafenelele, citește recenzii și salvează locațiile favorite.</p>
        </header>

        <!-- Harta Interactivă -->
        <div id="harta-cafenele" class="w-full h-96 rounded-2xl mb-10 shadow-md border border-gray-200 relative z-0"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
                <div class="h-40 bg-gray-200"></div>
                <div class="p-5">
                    <div class="flex justify-between items-start mb-2">
                        <h2 class="text-lg font-bold">Cafeneaua Central</h2>
                    </div>
                    <p class="text-xs text-indigo-600 mb-3">📍 București, Str. Exemplu 1</p>
                    <p class="text-sm text-gray-600 line-clamp-2 mb-4">Un loc perfect pentru studiu, cu Wi-Fi rapid.</p>
                    <div class="flex justify-between items-center border-t pt-4">
                        <div class="text-sm"><span class="text-yellow-500">★</span> 4.8 (24)</div>
                        <a href="detalii.html" class="text-sm font-semibold text-amber-900 hover:underline">Vezi detalii</a>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script>
        // 1. Inițializăm harta și o centrăm pe coordonatele Bucureștiului, cu un nivel de zoom de 13
        var harta = L.map('harta-cafenele').setView([44.4268, 26.1025], 13);

        // 2. Aducem "imaginile" hărții (străzile, clădirile) de la OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(harta);

        // 3. Adăugăm un marker pentru Cafeneaua Central (folosim aceleași coordonate pt exemplu)[cite: 1]
        var markerCafenea = L.marker([44.4268, 26.1025]).addTo(harta);

        // 4. Adăugăm un mic "Popup" care apare când dai click pe marker[cite: 1]
        markerCafenea.bindPopup(`
            <b>Cafeneaua Central</b><br>
            📍 Str. Exemplu nr. 1<br>
            <a href="detalii.html" class="text-amber-900 text-sm font-bold mt-1 inline-block">Vezi detalii</a>
        `);
    </script>
</body>
</html>
