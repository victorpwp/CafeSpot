<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare - CafeSpot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 sticky top-0 z-50 text-center">
        <a href="index.html" class="text-2xl font-extrabold text-amber-900 tracking-tighter hover:opacity-80">CafeSpot</a>
    </nav>

    <div class="flex justify-center items-center py-20 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-sm border w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6">Autentificare</h2>
            <input type="email" placeholder="Email" class="w-full mb-4 p-3 border rounded-lg focus:ring-2 focus:ring-amber-900">
            <input type="password" placeholder="Parolă" class="w-full mb-6 p-3 border rounded-lg focus:ring-2 focus:ring-amber-900">
            <button class="w-full bg-amber-900 text-white py-3 rounded-lg font-bold mb-4 hover:bg-amber-800">Intră în cont</button>
            <p class="text-center text-sm">Nu ai cont? <a href="register.html" class="text-amber-900 font-bold hover:underline">Înregistrează-te</a></p>
        </div>
    </div>
</body>
</html>
